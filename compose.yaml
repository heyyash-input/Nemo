services:
  nemo:
    build: .
    env_file: .env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DEMO_MODE: "false"
      SEED_DEMO: "false"
    ports:
      - "127.0.0.1:4000:4000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

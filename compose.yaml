services:
  nemo:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
